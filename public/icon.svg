<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4a68"/>
      <stop offset="1" stop-color="#071a29"/>
    </linearGradient>
    <linearGradient id="bagg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2a63b"/>
      <stop offset="1" stop-color="#d4842b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Latitudlinjer som antyder en glob -->
  <g stroke="#8fd0ae" stroke-opacity="0.20" fill="none" stroke-width="6">
    <circle cx="256" cy="256" r="196"/>
    <ellipse cx="256" cy="256" rx="196" ry="72"/>
    <ellipse cx="256" cy="256" rx="80" ry="196"/>
  </g>

  <!-- Ryggsäck -->
  <g>
    <!-- axelremmar -->
    <path d="M196 196 q-34 -74 30 -104" stroke="#2f7d63" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M316 196 q34 -74 -30 -104" stroke="#2f7d63" stroke-width="20" fill="none" stroke-linecap="round"/>
    <!-- huvudfack -->
    <rect x="150" y="170" width="212" height="230" rx="58" fill="url(#bagg)"/>
    <!-- lock -->
    <path d="M150 250 q106 -46 212 0 v-22 q0 -58 -58 -58 h-96 q-58 0 -58 58 z" fill="#ffca7a" fill-opacity="0.55"/>
    <!-- framfack -->
    <rect x="196" y="292" width="120" height="86" rx="26" fill="#071a29" fill-opacity="0.30"/>
    <!-- spänne -->
    <rect x="240" y="270" width="32" height="20" rx="7" fill="#2f7d63"/>
  </g>

  <!-- Flygplan på väg bort -->
  <g fill="#f6efe0">
    <path d="M392 128 l52 -18 -14 30 -4 2 -12 -6 -8 14 12 20 -12 6 -20 -26 -20 8 -6 -14 z"/>
  </g>
  <path d="M300 120 q46 -34 96 -8" stroke="#f6efe0" stroke-opacity="0.55" stroke-width="7"
        fill="none" stroke-dasharray="12 14" stroke-linecap="round"/>
</svg>
