<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b4a68"/><stop offset="1" stop-color="#071a29"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Litet flygplan uppe till höger -->
  <g transform="translate(440 70) rotate(-30) scale(0.6)" fill="#f6efe0">
    <path d="M-44 -6 h80 q20 0 26 6 q-6 6 -26 6 h-80 q-8 0 -8 -6 q0 -6 8 -6 z"/>
    <path d="M-4 -5 l-12 -40 h14 l30 40 z"/><path d="M-4 5 l-12 40 h14 l30 -40 z"/>
    <path d="M-42 -4 l-10 -18 h10 l14 18 z"/><path d="M-42 4 l-10 18 h10 l14 -18 z"/>
  </g>

  <!-- Jordklot bakom ryggsäcken: blått hav, gröna kontinenter och iskalotter
       klippta till cirkeln, skuggning nedtill till höger och en glans uppe
       till vänster så att det ser runt ut. Tecknat men stiliserat. -->
  <defs>
    <clipPath id="klot"><circle cx="256" cy="296" r="200"/></clipPath>
    <radialGradient id="hav" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#3f9ccb"/><stop offset="1" stop-color="#1f6a95"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="296" r="200" fill="url(#hav)"/>
  <g clip-path="url(#klot)">
    <g fill="#5cb87c">
      <!-- Nordamerika -->
      <path d="M60 200 q30 -70 100 -100 q60 -20 90 10 q-10 40 -50 50 q-40 8 -60 50 q-20 40 -50 30 q-30 -10 -30 -40 z"/>
      <!-- Sydamerika -->
      <path d="M120 350 q40 0 60 30 q20 40 0 90 q-14 36 -34 40 q-10 -50 -30 -90 q-16 -34 4 -70 z"/>
      <!-- Europa och Afrika -->
      <path d="M330 100 q50 -10 90 30 q30 30 40 80 q6 40 -6 80 q-14 44 -50 60 q-30 -30 -30 -80 q0 -40 -20 -70 q-30 -30 -50 -60 q0 -30 26 -40 z"/>
      <!-- Australien -->
      <path d="M350 430 q40 -20 70 0 q10 20 -6 36 q-40 10 -64 -6 q-10 -16 0 -30 z"/>
    </g>
    <!-- mörkare skog på kontinenterna -->
    <g fill="#3f9a62">
      <path d="M90 190 q30 -40 70 -50 q-10 30 -40 44 q-20 10 -30 6 z"/>
      <path d="M380 150 q30 20 44 60 q-24 -10 -40 -34 q-10 -16 -4 -26 z"/>
      <path d="M140 400 q20 10 26 40 q-16 -10 -26 -40 z"/>
    </g>
    <!-- iskalotter -->
    <path d="M186 96 h140 q20 24 -10 34 h-120 q-30 -10 -10 -34 z" fill="#f6efe0" fill-opacity="0.9"/>
    <path d="M196 496 h120 q10 -18 -10 -26 h-100 q-20 8 -10 26 z" fill="#f6efe0" fill-opacity="0.9"/>
    <!-- skuggning nedtill till höger -->
    <circle cx="200" cy="240" r="250" fill="none" stroke="#071a29" stroke-opacity="0.22" stroke-width="120"/>
  </g>
  <!-- glans uppe till vänster -->
  <path d="M112 200 q30 -80 110 -110" stroke="#f6efe0" stroke-opacity="0.35" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- atmosfärkant -->
  <circle cx="256" cy="296" r="200" fill="none" stroke="#9fd4e8" stroke-opacity="0.35" stroke-width="6"/>

  <!-- Ryggsäck i platt stil, efter referensen: sidofickor, kropp, lock med
       skugga under, två remmar med öppna spännen, bärögla -->
  <g fill="#f2a63b">
    <rect x="108" y="236" width="44" height="112" rx="18"/>
    <rect x="360" y="236" width="44" height="112" rx="18"/>
    <rect x="148" y="176" width="216" height="240" rx="42"/>
    <rect x="138" y="150" width="236" height="100" rx="40"/>
  </g>
  <!-- skuggan mellan lock och kropp -->
  <path d="M148 236 q0 14 14 14 h188 q14 0 14 -14" stroke="#071a29" stroke-width="16" fill="none" stroke-linecap="round"/>

  <!-- remmar -->
  <g fill="#f6efe0">
    <rect x="198" y="148" width="26" height="200" rx="8"/>
    <rect x="288" y="148" width="26" height="200" rx="8"/>
    <!-- öppna spännen -->
    <rect x="186" y="292" width="50" height="38" rx="10"/>
    <rect x="276" y="292" width="50" height="38" rx="10"/>
  </g>
  <g fill="#f2a63b">
    <rect x="198" y="304" width="26" height="14" rx="4"/>
    <rect x="288" y="304" width="26" height="14" rx="4"/>
  </g>
  <!-- bärögla -->
  <path d="M232 150 a24 24 0 0 1 48 0" stroke="#f6efe0" stroke-width="14" fill="none" stroke-linecap="round"/>
</svg>
