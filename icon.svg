<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4a68"/>
      <stop offset="1" stop-color="#071a29"/>
    </linearGradient>
    <linearGradient id="bagg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ac44"/>
      <stop offset="1" stop-color="#d4842b"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#f2a63b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Latitudlinjer som antyder en glob -->
  <g stroke="#8fd0ae" stroke-opacity="0.20" fill="none" stroke-width="6">
    <circle cx="256" cy="268" r="192"/>
    <ellipse cx="256" cy="268" rx="192" ry="70"/>
    <ellipse cx="256" cy="268" rx="78" ry="192"/>
  </g>

  <!-- Ryggsäck, sedd framifrån: axelremmar bakom, lock med spänne ovanpå,
       sidofickor, framficka med dragkedja och ett hoprullat liggunderlag
       under. Remmarna hänger nedåt; en båge ovanpå såg ut som ett hänglås. -->
  <g>
    <!-- axelremmar -->
    <path d="M204 214 v206" stroke="#2f7d63" stroke-width="26" stroke-linecap="round"/>
    <path d="M308 214 v206" stroke="#2f7d63" stroke-width="26" stroke-linecap="round"/>
    <!-- bärhandtag -->
    <path d="M236 178 q20 -26 40 0" stroke="#2f7d63" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- liggunderlag -->
    <rect x="164" y="392" width="184" height="34" rx="17" fill="#2f7d63"/>
    <line x1="164" y1="409" x2="348" y2="409" stroke="#245f4b" stroke-width="4"/>
    <!-- huvudfack -->
    <rect x="150" y="186" width="212" height="224" rx="44" fill="url(#bagg)"/>
    <!-- sidofickor -->
    <rect x="140" y="286" width="30" height="92" rx="15" fill="#c9782a"/>
    <rect x="342" y="286" width="30" height="92" rx="15" fill="#c9782a"/>
    <!-- lock som hänger över kanten -->
    <path d="M140 236 q116 -44 232 0 v26 q-116 -40 -232 0 z" fill="url(#lock)"/>
    <!-- lockets två remmar med spännen, som på en klassisk ryggsäck -->
    <g fill="#245f4b">
      <rect x="203" y="238" width="20" height="50" rx="6"/>
      <rect x="289" y="238" width="20" height="50" rx="6"/>
    </g>
    <g fill="#2f7d63">
      <rect x="197" y="274" width="32" height="22" rx="7"/>
      <rect x="283" y="274" width="32" height="22" rx="7"/>
    </g>
    <g fill="#071a29" fill-opacity="0.45">
      <rect x="203" y="281" width="20" height="8" rx="3"/>
      <rect x="289" y="281" width="20" height="8" rx="3"/>
    </g>
    <!-- framficka med dragkedja -->
    <rect x="196" y="310" width="120" height="78" rx="22" fill="#071a29" fill-opacity="0.28"/>
    <path d="M208 324 h96" stroke="#f6efe0" stroke-opacity="0.7" stroke-width="5" stroke-dasharray="6 6" stroke-linecap="round"/>
    <circle cx="304" cy="324" r="6" fill="#f6efe0" fill-opacity="0.8"/>
  </g>

  <!-- Flygplan uppifrån, på väg upp åt höger -->
  <g transform="translate(408 110) rotate(-32)" fill="#f6efe0">
    <!-- kropp -->
    <path d="M-58 -7 h100 q26 0 34 7 q-8 7 -34 7 h-100 q-10 0 -10 -7 q0 -7 10 -7 z"/>
    <!-- vingar -->
    <path d="M-6 -6 l-16 -54 h16 l40 54 z"/>
    <path d="M-6 6 l-16 54 h16 l40 -54 z"/>
    <!-- stjärtplan -->
    <path d="M-56 -5 l-12 -24 h11 l18 24 z"/>
    <path d="M-56 5 l-12 24 h11 l18 -24 z"/>
    <!-- fena -->
    <path d="M-62 -3 h-6 v6 h6 z" fill="#f6efe0" fill-opacity="0.6"/>
  </g>
  <path d="M296 138 q52 -40 100 -14" stroke="#f6efe0" stroke-opacity="0.55" stroke-width="7"
        fill="none" stroke-dasharray="12 14" stroke-linecap="round"/>
</svg>
