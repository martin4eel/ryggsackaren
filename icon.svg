<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b4a68"/><stop offset="1" stop-color="#071a29"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Flygplan uppe till höger, snett från sidan: kropp, fena, vinge med
       motor, kabinfönster och cockpit. Stiger åt höger. -->
  <g transform="translate(380 82) rotate(-16) scale(0.84)">
    <g fill="#f6efe0">
      <!-- fena -->
      <path d="M-74 -10 l-16 -40 h26 l18 40 z"/>
      <!-- stjärtplan -->
      <path d="M-78 -4 l-22 -10 h18 l14 10 z"/>
      <!-- kropp -->
      <path d="M-84 -2 q0 -14 16 -14 h122 q30 0 50 16 q-20 12 -50 12 h-122 q-16 0 -16 -14 z"/>
      <!-- vinge, svept bakåt mot betraktaren -->
      <path d="M0 4 l-30 38 h28 l40 -38 z"/>
      <!-- motor under vingen -->
      <rect x="-16" y="30" width="30" height="14" rx="7"/>
    </g>
    <g fill="#071a29">
      <!-- motorns intag -->
      <rect x="-16" y="33" width="6" height="8" rx="3"/>
      <!-- kabinfönster -->
      <circle cx="-50" cy="-5" r="3.5"/><circle cx="-36" cy="-5" r="3.5"/><circle cx="-22" cy="-5" r="3.5"/>
      <circle cx="-8" cy="-5" r="3.5"/><circle cx="6" cy="-5" r="3.5"/><circle cx="20" cy="-5" r="3.5"/><circle cx="34" cy="-5" r="3.5"/>
      <!-- cockpit -->
      <path d="M56 -12 q14 2 22 10 h-22 z"/>
    </g>
  </g>

  <!-- Jordklot bakom ryggsäcken: blått hav, gröna kontinenter med ljus
       kustlinje och vita iskalotter, allt klippt till cirkeln. Rundheten
       kommer från en mjuk sfärisk skuggning och en diskret reflex, inte
       från band. Väskan kastar en mjuk skugga på klotet. -->
  <defs>
    <clipPath id="klot"><circle cx="256" cy="290" r="192"/></clipPath>
    <radialGradient id="hav" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#46a6d6"/><stop offset="1" stop-color="#2273a0"/>
    </radialGradient>
    <radialGradient id="sfar" cx="0.36" cy="0.32" r="0.78">
      <stop offset="0.55" stop-color="#071a29" stop-opacity="0"/>
      <stop offset="1" stop-color="#071a29" stop-opacity="0.42"/>
    </radialGradient>
    <radialGradient id="reflex" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="mjuk" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <circle cx="256" cy="290" r="192" fill="url(#hav)"/>
  <g clip-path="url(#klot)">
    <g fill="#5cb87c" stroke="#a5e3b8" stroke-opacity="0.55" stroke-width="4" stroke-linejoin="round">
      <!-- Nordamerika -->
      <path d="M62 196 q30 -70 100 -100 q60 -20 90 10 q-10 40 -50 50 q-40 8 -60 50 q-20 40 -50 30 q-30 -10 -30 -40 z"/>
      <!-- Sydamerika -->
      <path d="M122 344 q40 0 60 30 q20 40 0 90 q-14 36 -34 40 q-10 -50 -30 -90 q-16 -34 4 -70 z"/>
      <!-- Europa och Afrika -->
      <path d="M330 100 q50 -10 90 30 q30 30 40 80 q6 40 -6 80 q-14 44 -50 60 q-30 -30 -30 -80 q0 -40 -20 -70 q-30 -30 -50 -60 q0 -30 26 -40 z"/>
      <!-- Australien -->
      <path d="M346 420 q40 -20 70 0 q10 20 -6 36 q-40 10 -64 -6 q-10 -16 0 -30 z"/>
    </g>
    <!-- iskalotter, oregelbundna och vita -->
    <g fill="#f7f4ec">
      <path d="M170 98 q40 -10 86 -4 q46 -6 86 6 q6 18 -14 26 q-30 -6 -60 2 q-40 -8 -74 4 q-30 -8 -24 -34 z"/>
      <path d="M176 484 q40 10 80 4 q40 6 78 -6 q6 -18 -12 -22 q-36 8 -66 0 q-40 8 -70 -2 q-20 8 -10 26 z"/>
    </g>
    <!-- väskans slagskugga på klotet -->
    <g fill="#071a29" fill-opacity="0.35" filter="url(#mjuk)" transform="translate(10 14)">
      <rect x="108" y="236" width="44" height="112" rx="18"/>
      <rect x="360" y="236" width="44" height="112" rx="18"/>
      <rect x="148" y="176" width="216" height="240" rx="42"/>
      <rect x="138" y="150" width="236" height="100" rx="40"/>
    </g>
    <!-- sfärisk skuggning -->
    <circle cx="256" cy="290" r="192" fill="url(#sfar)"/>
    <!-- reflex uppe till vänster -->
    <ellipse cx="150" cy="170" rx="90" ry="60" transform="rotate(-35 150 170)" fill="url(#reflex)"/>
  </g>
  <!-- tunn ljus kant -->
  <circle cx="256" cy="290" r="192" fill="none" stroke="#b7e0f2" stroke-opacity="0.45" stroke-width="3"/>

  <!-- Ryggsäck i platt stil, efter referensen: sidofickor, kropp, lock med
       skugga under, två remmar med öppna spännen, bärögla -->
  <g fill="#f2a63b">
    <rect x="108" y="236" width="44" height="112" rx="18"/>
    <rect x="360" y="236" width="44" height="112" rx="18"/>
    <rect x="148" y="176" width="216" height="240" rx="42"/>
    <rect x="138" y="150" width="236" height="100" rx="40"/>
  </g>
  <!-- skuggan mellan lock och kropp -->
  <path d="M148 236 q0 14 14 14 h188 q14 0 14 -14" stroke="#071a29" stroke-width="16" fill="none" stroke-linecap="round"/>

  <!-- remmar -->
  <g fill="#f6efe0">
    <rect x="198" y="148" width="26" height="200" rx="8"/>
    <rect x="288" y="148" width="26" height="200" rx="8"/>
    <!-- öppna spännen -->
    <rect x="186" y="292" width="50" height="38" rx="10"/>
    <rect x="276" y="292" width="50" height="38" rx="10"/>
  </g>
  <g fill="#f2a63b">
    <rect x="198" y="304" width="26" height="14" rx="4"/>
    <rect x="288" y="304" width="26" height="14" rx="4"/>
  </g>
  <!-- bärögla -->
  <path d="M232 150 a24 24 0 0 1 48 0" stroke="#f2a63b" stroke-width="14" fill="none" stroke-linecap="round"/>
</svg>
