# Internetcaféet i Upptäckaren.
#
# Publiceras med:  npm run deploy   (körs i den här mappen)
#
# Använd npm-skripten, inte npx wrangler rakt av: skripten pekar wrangler mot
# uppgifterna för kontot martink.1987@gmail.com. Datorn är annars inloggad på
# ett arbetskonto, och en deploy därifrån hamnar på fel ställe. Se README.md.

name = "upptackaren-internetcafe"
main = "index.js"
compatibility_date = "2026-08-30"

# Ingen anonym användningsstatistik behövs för det här.
send_metrics = false

[[kv_namespaces]]
binding = "DAGBOK"
id = "63ae588ccaad4950b050228401d66678"

# Hastighetsgräns per avsändaradress. Utan den kunde någon gå igenom alla
# niohundratusen nummer och läsa varenda dagbok, och på köpet tömma dagens
# gratiskvot så att caféet stod stängt för dem som spelar. Trettio anrop i
# minuten räcker gott för ett par telefoner på samma wifi; spelet självt
# synkar bara några gånger per resdag. Namnrymden är ett godtyckligt tal som
# skiljer den här gränsen från andra i samma konto.
[[unsafe.bindings]]
name = "BEGRANSNING"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Caféet svarar på sin egen underdomän. Cloudflare lägger DNS-posten själv;
# apex-posten mot GitHub Pages rörs inte.
[[routes]]
pattern = "cafe.upptackaren.se"
custom_domain = true
